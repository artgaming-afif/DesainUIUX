<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">

      <a class="navbar-brand" href="./index.html">
        <img src="assets/logo-social.png" alt="Bootstrap" width="30" height="24" />

          </li>

        <form class="d-flex" role="search">

    <!-- Form -->
  <div class="card">
    <div>
      <div class="card-header">
        <h4>Form Registrasi Peserta Seminar</h4>
      </div>
      <div class="card-body">
        <form>
          <div class="form-group row">
            <label class="col-4 col-form-label" for="name">Nam Lengkap</label>
            <div class="col-8">
              <input id="name" name="name" placeholder="Nama Lengkap" type="text" class="form-control"
                required="required" />
            </div>
          </div>
          <div class="form-group row">
            <label for="text" class="col-4 col-form-label">Tempat Lahir</label>
            <div class="col-8">
              <input id="text" name="text" placeholder="Tempat Lahir" type="text" class="form-control"
                required="required" />
            </div>
          </div>
          <div class="form-group row">
            <label for="date" class="col-4 col-form-label">Tanggal Lahir</label>
            <div class="col-8">
              <div class="input-group">
                <input id="text1" name="text1" placeholder="12 April 2006" type="date" class="form-control" />
                <div class="input-group-append">
                  <div class="input-group-text">
                    <i class="fa"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-4">Gender</label>
            <div class="col-8">
              <div class="custom-control custom-radio custom-control-inline">
                <input name="radio" id="radio_0" type="radio" required="required" class="custom-control-input"
                  value="laki" />
                <label for="radio_0" class="custom-control-label">Laki - laki</label>
              </div>
              <div class="custom-control custom-radio custom-control-inline">
                <input name="radio" id="radio_1" type="radio" required="required" class="custom-control-input"
                  value="perempuan" />
                <label for="radio_1" class="custom-control-label">Perempuan</label>
              </div>
            </div>
          </div>
          <div class="form-group row">
            <label for="text2" class="col-4 col-form-label">Email</label>
            <div class="col-8">
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-at"></i>
                  </div>
                </div>
                <input id="text2" name="text2" placeholder="contoh298@gmail.com" type="text" class="form-control"
                  required="required" />
              </div>
            </div>
          </div>
          <div class="form-group row">
            <label for="select" class="col-4 col-form-label">Pilihan Seminar</label>
            <div class="col-8">
              <select id="select" name="select" required="required" class="custom-select">
                <option value="mahasiswa">Seminar Roblox (Grow a Garden)</option>
                <option value="dosen">Seminar Roblox (Map Fish It)</option>
                <option value="karyawan">Seminar Roblox (Mount Sumbing)</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <div class="offset-4 col-8">
              <button name="submit" type="submit" class="btn btn-primary">
                Daftar
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
