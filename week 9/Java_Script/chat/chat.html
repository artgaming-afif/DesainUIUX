<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Chat Message</title>

    <style>

        #chatbox {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 260px;
            background: #f1f1f1;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            font-family: Arial;
        }

        #pesanArea {
            width: 100%;
            height: 180px;
            border: 1px solid #aaa;
            padding: 5px;
            overflow-y: auto;
            background: white;
            border-radius: 5px;
            font-size: 14px;
        }

        #inputPesan {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #888;
        }

        #btnKirim {
            width: 100%;
            margin-top: 8px;
            padding: 8px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>

    <script>
        function kirimPesan() {
            let input = document.getElementById("inputPesan");
            let area = document.getElementById("pesanArea");

            if (input.value.trim() === "") return;

            area.innerHTML += "<div>• " + input.value + "</div>";

            input.value = "";

            area.scrollTop = area.scrollHeight;
        }
    </script>

</head>
<body>

    <div id="chatbox">
        <div id="pesanArea"></div>

        <input type="text" id="inputPesan" placeholder="Tulis pesan...">

        <button id="btnKirim" onclick="kirimPesan()">Kirim</button>
    </div>

</body>
</html>
